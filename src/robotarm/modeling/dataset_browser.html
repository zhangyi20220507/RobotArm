<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RobotArm Dataset Browser</title>
  <style>
    :root{color-scheme:dark;--bg:#091019;--panel:#111b28;--panel2:#0d1622;--line:#24364b;--text:#e8f0f8;--muted:#899bb0;--blue:#55b8ff;--green:#55d69d;--amber:#ffc65c;--red:#ff7180}
    *{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--text);font:12px system-ui,sans-serif;display:grid;grid-template-columns:218px minmax(0,1fr)}button,input,select,textarea{font:inherit}button{cursor:pointer}
    aside{min-height:0;border-right:1px solid var(--line);display:grid;grid-template-rows:auto auto auto minmax(0,1fr);background:#0a121d}.brand{padding:10px 10px 7px;border-bottom:1px solid var(--line)}h1{font-size:16px;margin:0 0 2px}.muted{color:var(--muted)}
    .counts{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:5px}.count{padding:4px 1px;text-align:center;background:var(--panel);border-radius:5px}.count b{display:block;font-size:14px}.filters{display:grid;grid-template-columns:1fr 78px;gap:4px;padding:0 5px 5px}.filters input,.filters select,select,textarea{min-width:0;width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:5px}
    #episodes{min-height:0;overflow:auto;padding:0 4px 6px}.ep{display:grid;grid-template-columns:1fr auto;width:100%;text-align:left;padding:5px 7px;margin:1px 0;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--text);line-height:1.2}.ep:hover{background:#152235}.ep.active{border-color:var(--blue);background:#14283c}.ep small{color:var(--muted)}.badge{align-self:center;padding:1px 4px;border-radius:7px;font-size:9px}.keep{background:#174936;color:#77e8b6}.reject{background:#51232b;color:#ff9ba5}.review{background:#4c3917;color:#ffd27a}.unreviewed{color:var(--muted)}
    main{min-width:0;height:100vh;padding:10px 12px;display:grid;grid-template-rows:minmax(42px,auto) minmax(280px,44vh) auto minmax(240px,1fr);gap:8px;overflow:auto}.top{display:flex;align-items:center;justify-content:space-between}.top h1{display:inline;margin-right:10px}.nav button,.control{background:#172538;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:7px 11px}.nav button:hover,.control:hover{border-color:var(--blue)}
    .upper{display:grid;grid-template-columns:minmax(420px,1.35fr) minmax(285px,.72fr) minmax(285px,.78fr);gap:8px;min-height:0}.card{min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px}.card h2{font-size:12px;margin:0 0 5px}.video-card{display:grid;grid-template-rows:auto minmax(0,1fr) 34px}.videos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:5px;min-height:0}.video-wrap{min-height:0;display:grid;grid-template-rows:16px minmax(0,1fr)}video{width:100%;height:100%;object-fit:contain;background:#020406;border-radius:6px}
    .transport{display:grid;grid-template-columns:auto auto auto minmax(80px,1fr) 52px 56px;gap:4px;align-items:end}.transport button{height:28px;padding:2px 7px}.transport input{width:100%}.clock{text-align:right;font-variant-numeric:tabular-nums}.side{display:contents}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:4px}.metric{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:5px}.metric b{display:block;font-size:14px}.score{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}.score b{font-size:22px}.good b{color:var(--green)}.warn b{color:var(--amber)}.bad b{color:var(--red)}#warnings{font-size:10px;color:var(--amber);margin-top:4px;max-height:32px;overflow:auto}
    .review-card{display:grid;grid-template-rows:auto auto minmax(42px,1fr) auto;gap:5px}.review-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.review-buttons button{border:1px solid var(--line);border-radius:6px;padding:5px;background:var(--panel2);color:var(--text)}.review-buttons .selected{outline:2px solid white}.review-buttons .keep{background:#174936}.review-buttons .review{background:#4c3917}.review-buttons .reject{background:#51232b}textarea{resize:none}.save{background:#17679d!important;color:white!important}.details{display:flex;gap:12px;color:var(--muted);font-size:11px}
    .charts-card{display:grid;grid-template-rows:auto minmax(0,1fr)}.chart-head{display:flex;justify-content:space-between;align-items:center}.legend{color:var(--muted);font-size:11px}.dot{display:inline-block;width:10px;height:3px;margin:0 4px 2px 10px}.chart-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:5px;min-height:0}.mini{min-height:0;background:var(--panel2);border:1px solid var(--line);border-radius:6px;display:grid;grid-template-rows:18px minmax(0,1fr);padding:3px 5px}.mini-title{font-size:11px;color:var(--muted)}canvas{width:100%;height:100%;min-height:0}
    @media(max-width:1450px){.upper{grid-template-columns:minmax(420px,1.35fr) minmax(280px,.8fr)}.side{display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;min-height:0}}
    @media(max-width:1100px){body{grid-template-columns:200px minmax(0,1fr)}.upper{grid-template-columns:1.4fr 1fr}.chart-grid{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}}

    .trim-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .trim-tools input[type=number]{width:85px}
    .trim-tools input:not([type=checkbox]){background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:5px}
    .export-row{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
    #trimSummary,#exportStatus{white-space:pre-wrap;overflow-wrap:anywhere}
    #exportProgress{margin-top:8px}#exportProgress label{display:block;font-variant-numeric:tabular-nums}
    #exportProgressBar{display:block;width:100%;height:16px;margin:5px 0;accent-color:var(--blue)}
    #exportProgress.failed #exportProgressBar{accent-color:var(--red)}
    #exportProgress.complete #exportProgressBar{accent-color:var(--green)}
    .error{color:var(--red)}button:disabled{opacity:.5;cursor:wait}
    .top,.nav{gap:6px;flex-wrap:wrap}.nav{display:flex;align-items:center}
    html[lang="en"] .filters{grid-template-columns:1fr 105px}
    html[lang="en"] .transport{grid-template-columns:auto auto auto minmax(60px,1fr) 52px 56px}
    html[lang="en"] .review-buttons button{padding:5px 3px}
  </style>
</head>
<body>
  <aside>
    <div class="brand"><h1 data-i18n="Dataset Browser">数据集审核</h1><div id="dataset" class="muted"><span data-i18n="加载中…">加载中…</span></div></div>
    <div class="counts"><div class="count"><b id="cAll">0</b><span data-i18n="全部">全部</span></div><div class="count"><b id="cKeep">0</b><span data-i18n="保留">保留</span></div><div class="count"><b id="cReview">0</b><span data-i18n="复查">复查</span></div><div class="count"><b id="cReject">0</b><span data-i18n="剔除">剔除</span></div></div>
    <div class="filters"><input id="search" placeholder="搜索编号/任务" data-i18n-placeholder="搜索编号/任务"><select id="statusFilter"><option value="" data-i18n="全部状态">全部状态</option><option value="unreviewed" data-i18n="未审查">未审查</option><option value="keep" data-i18n="保留">保留</option><option value="review" data-i18n="待复查">待复查</option><option value="reject" data-i18n="剔除">剔除</option></select></div>
    <div id="episodes"></div>
  </aside>
  <main>
    <header class="top"><div><h1 id="title">Episode</h1><span id="task" class="muted"></span></div><div class="nav"><button id="languageToggle" type="button" class="control" title="切换为英文">English</button> <span class="muted"><span data-i18n="↑↓ 切换条目 · ←→ 逐帧 · 空格 播放/暂停">↑↓ 切换条目 · ←→ 逐帧 · 空格 播放/暂停&nbsp;&nbsp;</span></span><button id="prev" title="快捷键：↑" data-i18n-title="快捷键：↑"><span data-i18n="← 上一个">← 上一个</span></button> <button id="next" title="快捷键：↓" data-i18n-title="快捷键：↓"><span data-i18n="下一个 →">下一个 →</span></button></div></header>
    <section class="upper">
      <div class="card video-card"><h2><span data-i18n="同步视频">同步视频</span></h2><div id="videos" class="videos"></div><div class="transport"><button id="back" class="control" title="后退一帧" data-i18n-title="后退一帧"><span data-i18n="−1 帧">−1 帧</span></button><button id="play" class="control" title="空格播放/暂停" data-i18n-title="空格播放/暂停"><span data-i18n="▶ 播放">▶ 播放</span></button><button id="forward" class="control" title="前进一帧" data-i18n-title="前进一帧"><span data-i18n="+1 帧">+1 帧</span></button><input id="seek" type="range" min="0" max="1" value="0" step="0.001"><span id="clock" class="clock">0.00s</span><select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></div></div>
      <div class="side"><div class="card"><h2><span data-i18n="自动质量指标">自动质量指标 </span><span class="muted"><span data-i18n="（整条轨迹，仅辅助）">（整条轨迹，仅辅助）</span></span></h2><div id="metrics" class="metrics"></div><div id="warnings"></div></div><div class="card review-card"><div><h2><span data-i18n="人工审查">人工审查</span></h2><div id="details" class="details"></div></div><div class="review-buttons"><button data-status="keep" class="keep"><span data-i18n="保留">保留</span></button><button data-status="review" class="review"><span data-i18n="复查">复查</span></button><button data-status="reject" class="reject"><span data-i18n="剔除">剔除</span></button><button data-status=""><span data-i18n="清除">清除</span></button></div><textarea id="note" placeholder="记录问题发生的时间和现象" data-i18n-placeholder="记录问题发生的时间和现象"></textarea><div><button id="save" class="control save"><span data-i18n="保存标记与裁剪">保存标记与裁剪</span></button> <span id="saved" class="muted"></span></div></div></div>
    </section>
    <section class="card">
      <h2><span data-i18n="当前 Episode 保留片段（不修改原数据）">当前 Episode 保留片段（不修改原数据）</span></h2>
      <div class="trim-tools">
        <label><span data-i18n="起点（秒）">起点（秒） </span><input id="trimStart" type="number" min="0" step="any" value="0"></label>
        <label><span data-i18n="终点（秒）">终点（秒） </span><input id="trimEnd" type="number" min="0" step="any" value="0"></label>
        <button id="markStart" class="control"><span data-i18n="当前帧设起点">当前帧设起点</span></button>
        <button id="markEnd" class="control"><span data-i18n="当前帧后设终点">当前帧后设终点</span></button>
        <button id="trimReset" class="control"><span data-i18n="恢复整条">恢复整条</span></button>
        <label><input id="previewTrim" type="checkbox"><span data-i18n="只播放所选片段">只播放所选片段</span></label>
      </div>
      <div id="trimSummary" class="muted"></div>
      <div class="trim-tools export-row">
        <label><span data-i18n="新数据集名称">新数据集名称 </span><input id="exportName" size="42" placeholder="dataset_trimmed_v1"></label>
        <button id="export" class="control save"><span data-i18n="导出已保存的裁剪数据集">导出已保存的裁剪数据集</span></button>
        <span class="muted"><span data-i18n="保留/未审查参与导出；复查/剔除不导出。未裁剪的条目保留整条。">保留/未审查参与导出；复查/剔除不导出。未裁剪的条目保留整条。</span></span>
      </div>
      <div id="exportProgress" hidden>
        <label id="exportEpisodeCount" for="exportProgressBar"></label>
        <progress id="exportProgressBar" value="0" max="1" aria-labelledby="exportEpisodeCount"></progress>
        <div id="exportCurrent" class="muted"></div>
      </div>
      <div id="exportStatus" class="muted" role="status"></div>
    </section>
    <section class="card charts-card"><div class="chart-head"><h2><span data-i18n="全部关节与夹爪：状态 / 动作">全部关节与夹爪：状态 / 动作</span></h2><div class="legend"><i class="dot" style="background:var(--blue)"></i>state <i class="dot" style="background:var(--amber)"></i>action <i class="dot" style="background:var(--red)"></i><span data-i18n="当前帧">当前帧</span></div></div><div id="charts" class="chart-grid"></div></section>
  </main>

        updateExportJob(await api('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('#exportName').value.trim()})}));
        pollExport();
      }catch(e){exporting=false;$('#export').disabled=false;message('#exportStatus',e,true)}
    };
    function niceStep(value){let power=Math.pow(10,Math.floor(Math.log10(Math.max(value,1e-9)))),fraction=value/power,nice=fraction<=1?1:fraction<=2?2:fraction<=2.5?2.5:fraction<=5?5:10;return nice*power}
    function draw(canvas,j){let dpr=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;canvas.width=w*dpr;canvas.height=h*dpr;let x=canvas.getContext('2d');x.scale(dpr,dpr);let a=current.state.map(v=>v[j]),b=current.action.map(v=>v[j]),all=a.concat(b),dataLo=Math.min(...all),dataHi=Math.max(...all),span=Math.max(dataHi-dataLo,1e-6),step=niceStep(span*1.12/4),lo=Math.floor((dataLo-span*.06)/step)*step,hi=lo+4*step;if(hi<dataHi+span*.06){hi=Math.ceil((dataHi+span*.06)/step)*step;lo=hi-4*step}let left=39,right=4,top=3,bottom=3,plotW=Math.max(1,w-left-right),plotH=Math.max(1,h-top-bottom),decimals=step>=.1?2:step>=.01?3:4;x.font='9px system-ui';x.textAlign='right';x.textBaseline='middle';for(let k=0;k<5;k++){let y=top+plotH*k/4,value=hi-k*step;x.strokeStyle='#24364b';x.lineWidth=1;x.beginPath();x.moveTo(left,y);x.lineTo(w-right,y);x.stroke();x.fillStyle='#899bb0';x.fillText(value.toFixed(decimals),left-4,y)}function line(v,c){x.strokeStyle=c;x.lineWidth=1.35;x.beginPath();v.forEach((n,k)=>{let px=left+k*plotW/Math.max(1,v.length-1),py=top+(hi-n)*plotH/(hi-lo);k?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}try{const r=bounds();x.fillStyle='rgba(85,214,157,.12)';x.fillRect(left+r.start/current.duration*plotW,top,(r.end-r.start)/current.duration*plotW,plotH)}catch(e){}line(a,'#55b8ff');line(b,'#ffc65c');let px=left+time/current.duration*plotW;x.strokeStyle='#ff7180';x.beginPath();x.moveTo(px,top);x.lineTo(px,h-bottom);x.stroke()}function drawAll(){if(!current)return;$$('canvas[data-dimension]').forEach(c=>draw(c,+c.dataset.dimension))}window.onresize=drawAll;

    setLanguage(language,false);
    api('/api/meta').then(m=>{
      meta=m;$('#dataset').textContent=t('datasetSummary',{name:m.name,count:m.total_episodes,fps:m.fps});
      $('#exportName').value=m.suggested_export_name;
      message('#exportStatus',()=>t('exportParent',{path:m.export_parent}));
      renderList();if(m.total_episodes)loadEpisode(0);pollExport();
    }).catch(e=>message('#dataset',e,true));
  </script>
