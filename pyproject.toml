[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robotarm-workspace"
version = "0.1.0"
description = "Module-based orchestration for the RobotArm workspace"
requires-python = ">=3.10"

[project.optional-dependencies]
pi-lora = [
    "lerobot[training,pi,peft]==0.6.1",
    "PyYAML>=6,<7",
    "wandb>=0.24,<0.28",
]
hardware = [
    "numpy>=2.0,<2.3",
    "opencv-python>=4.9,<4.14",
    "pyrealsense2>=2.56,<2.59",
    "python-can>=4.2,<5",
    "PyYAML>=6,<7",
]
modeling = [
    "lerobot[dataset,diffusion,smolvla,viz]==0.6.1",
    "pyarrow>=21,<30",
    # LeRobot 0.6.1 still calls wandb.Run.get_url(), removed in wandb 0.28.
    "wandb>=0.24,<0.28",
]
simulation = [
    "gymnasium>=1.1,<2",
    "h5py>=3.14,<4",
    "mani-skill==3.0.1",
    "numpy>=2.0,<2.3",
    "opencv-python>=4.9,<4.14",
    "sapien==3.0.3",
    "stable-baselines3==2.9.0",
    "torch>=2.8,<2.12",
]
xr = [
    "numpy>=2.0,<2.3",
    "pyzmq>=26.2,<28",
    "scipy>=1.14,<2",
]
[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
robotarm = [
    "assets/*.urdf",
    "assets/piper/maniskill/*.urdf",
    "assets/piper/maniskill/meshes/*.stl",
    "assets/piper/maniskill/meshes/dae/*.dae",
    "modeling/scripts/*.bash",
    "modeling/configs/*.json",
    "modeling/*.html",
    "modeling/trajectory_studio/frontend/*.html",
    "modeling/trajectory_studio/frontend/*.css",
    "modeling/trajectory_studio/frontend/*.js",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["robotarm*"]

[project.scripts]
robotarm = "robotarm.cli:main"

[tool.black]
line-length = 120
